# =====================================================================
# Shockwave — config.example.ini
# Copy this file to config/config.ini before the first start.
# config/config.ini is required. Shockwave does not read .env files.
# Replace each <placeholder> below. Lines starting with # are comments.
# true/false fields accept: true, false, 1, 0, yes, no, on, off.
# =====================================================================

[Recording]
# Global hotkey. Use a modifier plus a key, for example:
# ctrl+space, alt+space, ctrl+alt+f8, f8, f9, f10, or pause.
# Avoid f5, f11, and f12.
hotkey = <ctrl+space>

# Stop recording automatically after this many seconds.
max_record_seconds = <180>

# Switch the radar to red this many seconds after recording starts.
# Use a number lower than max_record_seconds.
warn_record_seconds = <150>

[Recognition]
# Speech model used by the multi radio button.
# Parakeet name: nemo-parakeet-tdt-0.6b-v3.
# Whisper names: large-v3-turbo, large-v3, medium, small, base, tiny.
# A GigaAM name here still leaves multi on Parakeet. The ru button always uses GigaAM.
speech_recognition_model = <nemo-parakeet-tdt-0.6b-v3>

# Widget choice: ru uses GigaAM, multi uses the model above.
recognition_mode = <ru>

# Recognition language code passed to Whisper.
# Use auto to detect the spoken language.
# Examples: en, de, fr, es, zh, auto.
# GigaAM and Parakeet ignore this setting.
whisper_language = <en>

# GigaAM precision: int8 is smaller, float32 is full precision.
gigaam_quantization = <int8>

# true keeps the ONNX runtime from reserving a large memory arena.
onnx_optimize_memory = <true>

# Unload the selected model after this many idle seconds. Use 0 to keep it loaded.
model_idle_timeout = <300>

[Wake]
# Phrase that starts and stops recording. Matching ignores letter case.
# The phrase must match the chosen Vosk model language.
# Example: shockwave for en, мега for ru.
wake_word = <shockwave>

# Vosk model used only for the wake phrase. This is separate from the speech model.
# ru recognizes Russian words and phrases. en recognizes English words and phrases.
# Each choice is downloaded into its own folder under models.
vosk_model = <ru>

[Text]
# Widget checkboxes. true/false values below are examples.
# AI task, Idea, and mk Post cannot be used together.

# true adds punctuation and technical-term normalization through the LLM.
llm_norm = <false>

# true translates the finished text into English.
to_en = <false>

# true places the new text above the current clipboard text.
clip_prepend = <false>

# true listens for the wake phrase in the background.
wake = <false>

# true plays a sound when the text is ready.
alert = <true>

# true sends Ctrl+V after copying, into the currently focused input.
auto_paste = <false>

# true turns speech into a structured AI prompt.
ai_task = <false>

# true structures the spoken idea into a draft.
idea = <false>

# true turns speech into one social-media post.
# With to_en, the post is written in English.
mk_post = <false>

[LLM]
# Full OpenAI-compatible chat-completions URL.
# External servers must use https. http is allowed only for:
# http://127.0.0.1:PORT/v1/chat/completions or localhost.
# Example: https://example.com/v1/chat/completions
# Leave blank to disable LLM processing.
endpoint = <https://example.com/v1/chat/completions>

# Model name used by the endpoint.
# Leave blank to use gemini-3.5-flash.
# Example: gemini-3.5-flash
model = <gemini-3.5-flash>

# Request timeout in seconds. Leave blank to use 25.
timeout = <25>

# API key for the endpoint. Leave blank for a local server that needs no key.
# Example: YOUR_API_KEY
api_key = <YOUR_API_KEY>

[LLM Normalize]
# Used only when LLM norm is the only selected text mode.
# to EN, mk Post, Idea, and AI task always use [LLM], even with LLM norm checked.
# The same address and security rules apply. Leave blank to use [LLM].
endpoint = <https://example.com/v1/chat/completions>
model = <gemini-3.5-flash>
timeout = <25>
api_key = <YOUR_API_KEY>

[Prompts]
# Use the text from config/prompts/*.md.

[Widget]
# Start position: bottom-right, bottom-left, or top-center.
position = <bottom-right>

# Window opacity from 0.0 (invisible) to 1.0 (solid).
opacity = <0.85>

# Widget colors as #RRGGBB values.
ui_bg_color = <#3b274d>
ui_grip_color = <#2c1c3b>

[Sound]
# true plays the startup greeting.
startup_sound = <false>

[Console]
# Startup banner colors as #RRGGBB values.
cli_title_color = <#B45FEB>
cli_quote_color = <#807785>

# Banner spacing in spaces. Use whole numbers.
cli_banner_pad = <3>
cli_quote_pad = <6>
cli_title_pad = <0>
